# Deterministic Safety Kernel (P0, 2026-09-28) - crypto_trading/safety_kernel.py.
# HARD limits in front of every LIVE entry and every stop move. Nothing -
# GODFATHER, Guardian, leverage, max_concurrent_positions, "high confidence" -
# can raise or bypass them.
# Evidence: docs/superpowers/reports/2026-09-28-fas2-forensic-capital-loss.md
# (risk/trade was 2.8-20 % of equity, 45 % at once, 91 % of the loss in one
# correlated night, one stop ~0.2-0.7 % from liquidation).
#
# FIXED SIZING (user decision 2026-09-29): the LIVE size is always the fixed
# live_execution.yaml size - 100 USDT margin x 10 = ~1000 USDT notional - and
# is NEVER reduced. The kernel APPROVES that full size or REJECTS the entry.
# The former per-trade cap (1 % of equity / 10 USDT) and the 3x-equity
# notional ceiling were removed: they could only shrink the fixed size.

# REJECT if the worst-case loss of ALL open LIVE positions plus the new one
# would exceed 10 % of CURRENT equity. A position whose stop Profit
# Protection has moved to break-even only counts its residual cost risk.
max_portfolio_risk_pct: "0.10"

# REJECT if the same sum within one correlated group would exceed 5 % of
# current equity. Every alt long moved with BTC on 27-28/9 (91 % of the loss
# in one window), so all alts share one group.
max_group_risk_pct: "0.05"

# Cost assumptions inside "worst-case risk", from the verified LIVE fills:
# entry: market order may fill above the last price (buffer 0.3 %);
# stop: STOP_MARKET triggers on mark and fills below the stop - measured mean
#   0.11-0.16 %, worst 0.55 % -> 0.3 % buffer;
# fees: 0.05 % taker per side = 0.10 % round trip (measured).
entry_price_buffer_pct: "0.003"
stop_slippage_buffer_pct: "0.003"
round_trip_fee_pct: "0.001"

# Liquidation guard. Isolated long liquidation ~ entry x (1 - 1/leverage +
# mmr). Observed LIVE mmr 0.2-0.8 %; 1 % is deliberately conservative (it
# places the estimated liquidation price HIGHER, i.e. closer to the stop).
# The stop must sit at least 2 % of the entry price above that estimate.
maintenance_margin_rate: "0.01"
min_liquidation_buffer_pct: "0.02"

# Correlation groups: exact symbol first, then prefix, else default.
symbol_groups:
  BTC-USDT: crypto_major
  ETH-USDT: crypto_major
group_prefixes:
  NCSK: tokenized_equity
  NCCO: commodity_fx
  NCFX: commodity_fx
default_group: crypto_alt
