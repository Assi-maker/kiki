# BingX Live execution (2026-09-06) - a third, independent parallel
# observer of PAPER's Gate-approved trades, see
# docs/superpowers/specs/2026-09-06-bingx-live-execution-design.md. Whether
# the thread runs at all is an env-var arm flag
# (CRYPTO_TRADING_LIVE_EXECUTION_ENABLED), not this file. max_concurrent_positions,
# margin_per_trade_usdt, and leverage are hard user-mandated caps - never
# raise them without a fresh, explicit user decision.
check_interval_seconds: 30
claim_stale_after_seconds: 30
max_retries: 3
max_concurrent_positions: 4
# 2026-09-26, explicit user decision: 10 -> 100 USDT margin per position
# (x10 leverage = ~1000 USDT notional; 4 positions = 400 USDT margin /
# ~4000 USDT notional at most). leverage and max_concurrent_positions
# unchanged. Sizing, SL/TP, Gate, Guardian and GODFATHER policy untouched.
margin_per_trade_usdt: "100"
leverage: 10
max_position_hold_hours: 6
margin_safety_buffer_usdt: "1.00"
# Signal staleness/TTL (locked 2026-09-06, spec §17): a Gate-CONFIRMED
# signal older than this may never be claimed/submitted by LIVE. LIVE-only,
# independent of max_position_hold_hours above.
signal_ttl_seconds: 1800
# Profit protection (Task 3): threshold is a config value here (not
# hardcoded) so a future change can retune it without touching code.
# Activated 2026-09-13 (explicit user decision, after full implementation +
# 3 rounds of deep review incl. one Critical bug found/fixed/re-verified):
# +1.0% unrealized profit -> real BingX SL moved to break-even. TP/initial
# SL/entry/sizing/leverage/Gate/Risk/AI/exposure/Guardian all unchanged -
# this flag ONLY arms the break-even SL replacement mechanism.
profit_protection_enabled: true
profit_protection_threshold_pct: "0.01"

# Discovery-side AI-cost gate (2026-09-19, paper_trading/live_discovery_gate.py).
# Not trading limits - they only shape how many candidates a discovery tick
# may send to full AI analysis (free-and-affordable LIVE slots, from the real
# BingX balance). The hard caps above are untouched. Cooldown debounces
# SUPPRESSED decisions only; buffer = extra candidates on top of usable slots.
discovery_gate_cooldown_seconds: 300
discovery_candidate_buffer: 0
