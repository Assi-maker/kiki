discovery_interval_minutes: 15
monitoring_interval_seconds: 30
top_n: 30
cooldown_minutes: 60
max_data_age_seconds:
  ticker: 30
  kline: 120
  funding_rate: 3600
  open_interest: 300
  contracts: 86400
min_sample_size_for_calibration: 30
calibration_preliminary_sample_size: 10
sqlite_busy_timeout_ms: 5000
required_fields:
  ticker: [lastPrice, askPrice, bidPrice, quoteVolume, closeTime]
  kline: [open, high, low, close, volume, time]
  funding_rate: [fundingRate, fundingTime, markPrice]
  open_interest: [openInterest, time]
  contracts: [symbol, status]
screener_timeframes: ["1h", "4h"]
bingx_base_url: "https://open-api.bingx.com"
bingx_requests_per_second: 10
bingx_cache_ttl_seconds: 5
bingx_max_retries: 3
kline_consistency_tolerance_pct: "0.5"
eligibility_min_quote_volume_24h_usdt: "5000000"
eligibility_max_spread_pct: "0.002"
screener_lookback_periods: 20
screener_price_volatility_threshold_pct: "2.0"
screener_rsi_period: 14
screener_rsi_overbought_threshold: "70"
screener_volume_zscore_threshold: "2.5"
screener_funding_rate_threshold_pct: "0.05"
screener_funding_history_limit: 10
evidence_change_threshold_for_reanalysis: "0.15"
news_rss_base_url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
fear_greed_base_url: "https://api.alternative.me/fng/"
