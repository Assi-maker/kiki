# Position Guardian (2026-09-04, shadow mode only) - see
# docs/superpowers/specs/2026-09-04-position-guardian-design.md §5.
# Thresholds below are EXPLICITLY UNVALIDATED starting points, meant to be
# re-tuned after Detective calibrates real shadow-mode observations against
# actual outcomes - never treated as final. factor_weights need not sum to
# 1.0 (decay_score is a weight-normalized average, see deterministic.py).
check_interval_seconds: 60
watch_decay_threshold: "0.35"
protect_decay_threshold: "0.55"
exit_decay_threshold: "0.75"
factor_weights:
  time_decay: "1"
  momentum_decay: "1"
  volume_decay: "1"
  funding_decay: "1"
  secondary_confirmation_lost: "1"
  market_regime: "1"
# Guardian-assisted exit (2026-09-05, explicit användarkrav): AKTIVERAD
# 2026-09-05 efter 837/837 gröna tester och explicit beslut - Guardian får
# nu faktiskt stänga en position tidigare än max_position_hold_hours när
# den deterministiska klassificeringen (guardian/deterministic.py::
# classify_guardian_state()) är exakt "EXIT". HOLD/WATCH/PROTECT stänger
# fortfarande ALDRIG. Time_limit (6h) kollas alltid FÖRE guardian_exit i
# paper_trading/monitoring.py::check_exit_trigger() - Guardian kan därför
# strukturellt aldrig förlänga en position förbi den absoluta gränsen.
assisted_exit_enabled: true

# Guardian Authority (2026-09-14, docs/superpowers/plans/
# 2026-09-14-guardian-authority.md, Task 10): explicit documentation for
# the four authority_* fields config/loader.py::GuardianConfig has carried
# as Pydantic defaults since Tasks 6/7 (pulled forward there because the
# pre-entry veto wrapper and the tick-time TIGHTEN_SL/CLOSE_EARLY decision
# already had a hard runtime dependency on these fields existing, before
# Task 10 - this plan's own designated owner of the full config surface -
# ever ran). Until today, NONE of the four appeared here, so this file
# never overrode the Pydantic defaults - the feature was inert purely
# because there was nothing in the running config to turn it on, not
# because of any code-level gate. The four values below are the EXACT SAME
# values already in effect as Pydantic defaults (see GuardianConfig) -
# this is a documentation-only change, zero behavior change: it makes the
# config surface visible/inspectable the same way every other Guardian
# field already is in this file, nothing more.
#
# authority_enabled: master switch for BOTH integration points (the
# pre-entry veto hook in guardian/authority.py::
# maybe_open_position_for_candidate AND the tick-time TIGHTEN_SL/
# CLOSE_EARLY decision in guardian/tick.py::process_one_position).
# authority_veto_threshold / authority_tighten_threshold /
# authority_close_threshold: see config/loader.py::GuardianConfig's own
# docstring comments for the full reasoning behind each threshold's exact
# magnitude - not repeated here.
#
# ACTIVATED 2026-09-17 (docs/superpowers/plans/
# 2026-09-15-guardian-authority-live-autonomy.md, Task 9) after all 8 code
# tasks + a final whole-branch review that found and required fixing one
# proven Critical defect (an LLM-proposed empty condition could escape its
# validated evidence pool and fire on the OTHER decision type in
# production) plus four Important cross-task issues - all fixed and
# independently re-derived as correct by a second, scoped re-review before
# this activation. This makes GODFATHER's real interventions live on BOTH
# PAPER and LIVE (explicit user choice, no separate PAPER-only proving
# stage). The following remain true regardless, grep/AST-provable against
# the live source at activation time:
#   - The pure decision core (evaluate_heuristics, decide_pre_entry,
#     decide_open_position, heuristic_condition_matches,
#     _compute_proposed_new_sl, _groups_for_factors) is byte-identical to
#     before this whole plan - the self-improvement pipeline only ever
#     reuses it, never modifies it.
#   - upsert_guardian_authority_heuristic (the only write path into the
#     real heuristics table this decision core reads) has exactly 4 call
#     sites in the whole codebase: the original self-critique, the
#     self-improvement pipeline's promotion step, its demotion step, and
#     its crashed-promotion orphan-reconciliation step - no other writer
#     anywhere.
#   - No code this plan added calls set_leverage or imports
#     position_sizing.py; gate/, screening/, position_opening.py,
#     risk_limits.yaml, and live_execution.yaml's hard limits (leverage,
#     margin, max_concurrent_positions) all have zero diff across the
#     whole plan - never touched, never able to be touched by anything
#     GODFATHER's self-authored heuristics can write.
authority_enabled: true
authority_veto_threshold: "0.3"
authority_tighten_threshold: "0.15"
authority_close_threshold: "0.45"
# Guardian Authority Shadow/Observation Mode (2026-09-15, docs/superpowers/
# plans/2026-09-15-guardian-authority-shadow.md, Task 11 activation):
# separate, independent boolean flag that gates ONLY the new shadow-
# observation code paths from this plan. This is a completely distinct flag
# from authority_enabled above - they have NO interaction between them.
# ACTIVATED 2026-09-15 after all 10 code tasks + final whole-branch review
# (no Critical findings; 3 Important findings fixed, re-reviewed clean) -
# real PAPER positions are unaffected: no write to positions/
# guardian_authority_decisions/guardian_authority_heuristics, no
# open_position_for_candidate/tighten_position_stop_loss/cancel_order/
# place_stop_loss_order/set_leverage call anywhere in the new code
# (grep-provable, independently re-verified by the final review). This
# turns ON hypothetical PAPER decision logging (incl. hypothetical
# NO_ACTION) so real data accumulates for future human-reviewed evaluation -
# it does NOT make Guardian Authority act on anything for real; authority_
# enabled above stays false, LIVE stays completely untouched.
authority_shadow_enabled: true
