# Position Guardian (2026-09-04, shadow mode only) - see
# docs/superpowers/specs/2026-09-04-position-guardian-design.md §5.
# Thresholds below are EXPLICITLY UNVALIDATED starting points, meant to be
# re-tuned after Detective calibrates real shadow-mode observations against
# actual outcomes - never treated as final. factor_weights need not sum to
# 1.0 (decay_score is a weight-normalized average, see deterministic.py).
check_interval_seconds: 60
watch_decay_threshold: "0.35"
protect_decay_threshold: "0.55"
exit_decay_threshold: "0.75"
factor_weights:
  time_decay: "1"
  momentum_decay: "1"
  volume_decay: "1"
  funding_decay: "1"
  secondary_confirmation_lost: "1"
  market_regime: "1"
# Guardian-assisted exit (2026-09-05, explicit användarkrav): AKTIVERAD
# 2026-09-05 efter 837/837 gröna tester och explicit beslut - Guardian får
# nu faktiskt stänga en position tidigare än max_position_hold_hours när
# den deterministiska klassificeringen (guardian/deterministic.py::
# classify_guardian_state()) är exakt "EXIT". HOLD/WATCH/PROTECT stänger
# fortfarande ALDRIG. Time_limit (6h) kollas alltid FÖRE guardian_exit i
# paper_trading/monitoring.py::check_exit_trigger() - Guardian kan därför
# strukturellt aldrig förlänga en position förbi den absoluta gränsen.
assisted_exit_enabled: true
